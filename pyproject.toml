[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "proplay"
version = "1.0.0"
description = "ProPlay: Procedural Pre-play for LLM Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "openai>=1.0.0",
    "requests>=2.28.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
sciworld = [
    "agentenv-sciworld",
    "scienceworld",
]
plancraft = [
    "plancraft",
]
taubench = [
    # tau-bench is installed from source:
    # pip install git+https://github.com/sierra-research/tau-bench
]
dev = [
    "pytest>=7.0",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["proplay*", "benchmarks*"]

[tool.ruff]
line-length = 100
target-version = "py310"
